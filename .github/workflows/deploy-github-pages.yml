# Deploy msal-front a GitHub Pages
# Repo: https://github.com/DSY1107-cloud/msal-front
# URL:  https://dsy1107-cloud.github.io/msal-front/
#
# Antes del primer deploy:
# 1. Settings → Pages → Source: GitHub Actions
# 2. Settings → Environments → crea "env" (o usa Repository secrets)
#    Environment secrets (environment "env"):
#    - VITE_CLIENT_ID
#    - VITE_TENANT_ID
#    - VITE_API_URL          (ej. https://phbqfmzycj.execute-api.us-east-1.amazonaws.com)
#    - VITE_REDIRECT_URI     (ej. https://dsy1107-cloud.github.io/msal-front/)
# 3. En Entra ID → App registration → SPA → agregar la misma VITE_REDIRECT_URI
# 4. En API Gateway → CORS → origin https://dsy1107-cloud.github.io

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets creados como "Environment secrets" del environment "env"
    environment: env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # base path del repo en Pages (/msal-front/)
          VITE_BASE_PATH: /msal-front/
          VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
          VITE_TENANT_ID: ${{ secrets.VITE_TENANT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI }}
        run: |
          if [ -z "$VITE_CLIENT_ID" ] || [ -z "$VITE_TENANT_ID" ] || [ -z "$VITE_API_URL" ] || [ -z "$VITE_REDIRECT_URI" ]; then
            echo "::error::Faltan secrets. Crea VITE_CLIENT_ID, VITE_TENANT_ID, VITE_API_URL y VITE_REDIRECT_URI en Settings → Secrets → Actions."
            exit 1
          fi
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
